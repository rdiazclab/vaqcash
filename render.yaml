# Blueprint de Render: crea la base y el servicio web en un solo paso.
# Render → New → Blueprint → apunta al repo. Luego pon CORS_ORIGIN y
# PUBLIC_WEB_URL con el dominio real de Vercel.
databases:
  - name: sobres-db
    plan: free
    databaseName: sobres
    user: sobres

services:
  - type: web
    name: sobres-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sobres-db
          property: connectionString
      - key: PORT
        value: 10000
      - key: PUBLIC_WEB_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: PAYMENT_LATENCY_MS
        value: 1200
      - key: PAYMENT_FAILURE_RATE
        value: "0"
