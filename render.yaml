# Blueprint de Render: crea la base, la API y el front estático en un solo paso.
#
# Render → New → Blueprint → apunta a este repo.
#
# Hay una dependencia circular entre los dos servicios web (la API necesita el
# dominio del front para el CORS, el front necesita el dominio de la API), así
# que esas tres variables van con `sync: false` y se rellenan a mano después
# del primer deploy, cuando Render ya asignó las URLs.
databases:
  - name: sobres-db
    plan: free
    databaseName: sobres
    user: sobres

services:
  - type: web
    name: sobres-api
    runtime: node
    plan: free
    rootDir: backend
    # Render exporta NODE_ENV=production, y con eso `npm install` se salta las
    # devDependencies: sin ellas no existen ni el CLI de prisma ni tsc y el
    # build revienta. --include=dev las recupera.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: sobres-db
          property: connectionString
      - key: PORT
        value: 10000
      # requiredInProduction en src/config/env.ts: sin esto el proceso no arranca.
      - key: JWT_SECRET
        generateValue: true
      - key: PUBLIC_WEB_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: PAYMENT_LATENCY_MS
        value: "1200"
      - key: PAYMENT_FAILURE_RATE
        value: "0"

  - type: web
    name: sobres-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: dist
    # SPA: react-router necesita que cualquier ruta sirva index.html.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_USE_MOCKS
        value: "false"
      - key: VITE_API_URL
        sync: false
