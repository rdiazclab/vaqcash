# Blueprint de Render: crea la base, la API y el front estatico en un solo paso.
#
# Render -> New -> Blueprint -> apunta a este repo.
#
# Las URLs publicas van escritas a mano abajo en vez de quedar como
# `sync: false`. Con sync:false Render crea la variable vacia, y env.ts
# (requiredInProduction) lanza excepcion al arrancar si CORS_ORIGIN o
# PUBLIC_WEB_URL faltan en produccion: la API moria antes de escuchar.
#
# Render asigna <nombre-del-servicio>.onrender.com salvo que el subdominio
# ya este cogido por otra cuenta; si eso pasa, corrige estas tres URLs con
# las que aparezcan realmente en el dashboard.
databases:
  - name: vaqcash-db
    plan: free
    databaseName: vaqcash
    user: vaqcash

services:
  - type: web
    name: vaqcash-api
    runtime: node
    plan: free
    rootDir: backend
    # Render exporta NODE_ENV=production, y con eso `npm install` se salta las
    # devDependencies: sin ellas no existen ni el CLI de prisma ni tsc y el
    # build revienta. --include=dev las recupera.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: vaqcash-db
          property: connectionString
      - key: PORT
        value: "10000"
      - key: JWT_SECRET
        generateValue: true
      - key: PUBLIC_WEB_URL
        value: https://vaqcash-web.onrender.com
      - key: CORS_ORIGIN
        value: https://vaqcash-web.onrender.com
      - key: PAYMENT_LATENCY_MS
        value: "1200"
      - key: PAYMENT_FAILURE_RATE
        value: "0"

  - type: web
    name: vaqcash-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: dist
    # SPA: react-router necesita que cualquier ruta sirva index.html.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_USE_MOCKS
        value: "false"
      - key: VITE_API_URL
        value: https://vaqcash-api.onrender.com/api
